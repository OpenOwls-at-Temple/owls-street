name: Owls Street Pulse CI

# Lives at the repository root because GitHub only reads workflows from
# .github/workflows/ there — this file previously sat in owls-street-pulse/.github/ and so
# never ran on any push or pull request.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'owls-street-pulse/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'owls-street-pulse/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owls-street-pulse

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: owls-street-pulse/requirements.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      env:
        PYTHONPATH: .
      run: python -m pytest tests/
