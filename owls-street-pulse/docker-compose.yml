version: '3.8'

services:
  owls-street-pulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: owls-street-pulse
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Mount configuration folder (Read-Write for UI saves)
      - ./config:/app/config
      # Mount data folder to persist SQLite database
      - ./data:/app/data
      # Mount logs folder to view application log files on host
      - ./logs:/app/logs

